name: Changelog
description: Add changelog entries (one or many)
title: "[Changelog] "
labels: ["changelog-entry"]
body:
  - type: markdown
    attributes:
      value: |
        Paste one line per entry — single or whole release, same form.

        **Format:** `<type> (<component>): <text>`

        - **types:** `new`, `fix`, `security`, `warning`, `enhancement`
        - **components:** `es`, `kbn`, `es|kbn`
        - text supports markdown links

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.68.0"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: |
        new (es): 9.0.2, 8.18.2, 8.17.7 support
        new (kbn): 9.0.2, 8.18.2, 8.17.7 support
        fix (es): [patching on Windows](https://forum.readonlyrest.com/t/...)
        security (es): CVE-2024-53382
      render: text
    validations:
      required: true
