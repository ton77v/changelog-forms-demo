name: Changelog form demo

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  parse-and-comment:
    if: contains(github.event.issue.labels.*.name, 'changelog-entry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || ''

            // Issue Forms render as: ### <Field>\n\n<value>\n\n### <Next>...
            const sections = {}
            let cur = null, buf = []
            for (const line of body.split(/\r?\n/)) {
              if (line.startsWith('### ')) {
                if (cur) sections[cur] = buf.join('\n').trim()
                cur = line.slice(4).trim()
                buf = []
              } else {
                buf.push(line)
              }
            }
            if (cur) sections[cur] = buf.join('\n').trim()

            const version = (sections['Version'] || '').trim()
            // `render: text` in the form wraps notes in ```text ... ``` — strip the fence
            const stripFence = (s) => {
              const lines = s.split(/\r?\n/)
              if (lines[0] && /^```/.test(lines[0].trim())) lines.shift()
              if (lines.length && /^```/.test((lines[lines.length - 1] || '').trim())) lines.pop()
              return lines.join('\n')
            }
            const notes = stripFence((sections['Notes'] || '').trim()).trim()

            const errors = []
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              errors.push(`Version must be X.Y.Z — got: \`${version}\``)
            }
            if (!notes) errors.push('Notes is empty')

            const TYPE_MAP = {
              new: 'new', feat: 'new', feature: 'new',
              fix: 'fix', bugfix: 'fix',
              security: 'security', 'security fix': 'security', sec: 'security',
              warning: 'warning', warn: 'warning',
              enhancement: 'enhancement', enh: 'enhancement', improve: 'enhancement',
            }
            const COMP_MAP = {
              es: ['es'], kbn: ['kbn'], 'es|kbn': ['es', 'kbn'],
              'kbn|es': ['es', 'kbn'], both: ['es', 'kbn'],
            }

            const entries = []
            const lineRe = /^\s*(?<type>[\w ]+?)\s*\(\s*(?<comp>[^)]+?)\s*\)\s*:\s*(?<text>.+?)\s*$/i

            notes.split(/\r?\n/).forEach((raw, i) => {
              const line = raw.trim()
              if (!line || line.startsWith('#') || line.startsWith('//')) return
              const m = line.match(lineRe)
              if (!m) {
                errors.push(`Line ${i + 1}: cannot parse \`${line}\` — expected \`<type> (<component>): <text>\``)
                return
              }
              const type = TYPE_MAP[m.groups.type.toLowerCase()]
              const comp = COMP_MAP[m.groups.comp.toLowerCase().replace(/\s+/g, '')]
              if (!type) errors.push(`Line ${i + 1}: unknown type \`${m.groups.type}\` — use one of: ${Object.keys(TYPE_MAP).slice(0, 5).join(', ')}`)
              if (!comp) errors.push(`Line ${i + 1}: unknown component \`${m.groups.comp}\` — use one of: es, kbn, es|kbn`)
              if (type && comp) entries.push({ type, components: comp, text: m.groups.text })
            })

            // Build YAML
            const today = new Date().toISOString().slice(0, 10)
            const yamlEsc = (s) => /[:#\[\]{}&*!|>'"%@`]|^\s|\s$/.test(s) ? JSON.stringify(s) : s
            let yaml = `version: ${version}\nrelease_date: ${today}\nentries:\n`
            for (const e of entries) {
              yaml += `  - type: ${e.type}\n`
              yaml += `    components: [${e.components.join(', ')}]\n`
              yaml += `    text: ${yamlEsc(e.text)}\n`
            }

            const target = `changelog/${version}.yaml`
            const marker = '<!-- changelog-form-bot -->'

            let comment
            if (errors.length) {
              comment = `${marker}\n**Could not parse** (${errors.length} issue${errors.length > 1 ? 's' : ''}):\n\n` +
                errors.map(e => `- ${e}`).join('\n') +
                `\n\n_Edit the issue body to fix — this comment will refresh._`
            } else {
              comment = `${marker}\nParsed **${entries.length}** entr${entries.length === 1 ? 'y' : 'ies'} → would write to **\`${target}\`**:\n\n` +
                '```yaml\n' + yaml + '```\n\n' +
                `_Demo: real action would commit YAML, regen \`changelog.md\`, open PR._`
            }

            // Auto-rename title if parse succeeded
            if (!errors.length && entries.length) {
              const summary = entries.length === 1
                ? `${entries[0].type} (${entries[0].components.join('|')}): ${entries[0].text}`.slice(0, 80)
                : `${entries.length} entries`
              const newTitle = `[Changelog ${version}] ${summary}`
              if (context.payload.issue.title !== newTitle) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: newTitle,
                })
              }
            }

            // Find existing bot comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              })
            }
